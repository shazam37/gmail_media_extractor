name: Build & Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GmailMediaExtractor_Windows
          - os: macos-latest
            artifact: GmailMediaExtractor_macOS
          - os: ubuntu-latest
            artifact: GmailMediaExtractor_Linux

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write credentials.json
        env:
          CREDS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: >
          python -c "import os; open('credentials.json','w',encoding='utf-8').write(os.environ['CREDS'])"

      - name: Patch Microsoft client ID
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
        run: >
          python -c "import os; path='core.py'; src=open(path,'r',encoding='utf-8').read(); src=src.replace('YOUR_AZURE_APP_CLIENT_ID_HERE', os.environ['MS_CLIENT_ID']); open(path,'w',encoding='utf-8').write(src)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: python -m PyInstaller build.spec --noconfirm

      - name: Prepare package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force GmailMediaExtractor -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force GmailMediaExtractor
          Copy-Item dist\GmailMediaExtractor.exe GmailMediaExtractor\

      - name: Prepare package (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf GmailMediaExtractor
          mkdir -p GmailMediaExtractor
          cp -r dist/GmailMediaExtractor.app GmailMediaExtractor/

      - name: Prepare package (Linux)
        if: runner.os == 'Linux'
        run: |
          rm -rf GmailMediaExtractor
          mkdir -p GmailMediaExtractor
          cp dist/GmailMediaExtractor GmailMediaExtractor/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: files/GmailMediaExtractor
          if-no-files-found: error
